services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI on a Render Web Service. SQLite only: NO managed database.
  # ---------------------------------------------------------------------------
  - type: web
    name: flowguard-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # SQLite — deliberately NO managed Postgres.
      # Render allows only ONE free-tier database per account, and this prototype
      # does not need one. backend/app/seed.py rebuilds the entire demo (Treasure,
      # the officer, account 0123456789, the balance, the trusted beneficiary) on
      # every boot via main.py's lifespan, so there is nothing to persist.
      # Trade-off: Render's filesystem is EPHEMERAL — demo state resets on deploy,
      # restart or free-tier spin-down. That is fine (and desirable) here: the demo
      # always boots into a known state, and POST /api/demo/reset re-seeds on demand.
      - key: DATABASE_URL
        value: sqlite:///./flowguard.db
      # Auto-wired to the static site's public URL — no manual dashboard step.
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: flowguard-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ENV
        value: production

  # ---------------------------------------------------------------------------
  # Frontend — Vite build served as a Render Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: flowguard-web
    runtime: static
    rootDir: frontend
    # NOTE: do NOT add `plan` here. Render's blueprint schema defines a static
    # site as `type: web` + `runtime: static` with additionalProperties: false and
    # NO `plan` property — static sites are always free. Adding `plan: free` fails
    # with: "services[1].plan — no such plan free for service type web".
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Vite inlines this at BUILD time. Auto-wired to the API's public URL.
      # Manual fallback: https://<flowguard-api>.onrender.com
      - key: VITE_API_URL
        fromService:
          type: web
          name: flowguard-api
          envVarKey: RENDER_EXTERNAL_URL
    # REQUIRED: this is a single-page app (React Router). Without the rewrite,
    # deep links and refreshes on /login, /ops, /verify/:txnId and /cases/:id
    # return 404 from the static host.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
