services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI on a Render Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: flowguard-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Render injects the managed Postgres connection string.
      # database.py normalises postgres:// -> postgresql+psycopg:// automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: flowguard-db
          property: connectionString
      # Auto-wired to the static site's public URL — no manual dashboard step.
      # If your Render plan/blueprint rejects fromService for a static site,
      # delete this block and set CORS_ORIGINS manually to:
      #   https://<flowguard-web>.onrender.com
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: flowguard-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ENV
        value: production

  # ---------------------------------------------------------------------------
  # Frontend — Vite build served as a Render Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: flowguard-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Vite inlines this at BUILD time. Auto-wired to the API's public URL.
      # Manual fallback: https://<flowguard-api>.onrender.com
      - key: VITE_API_URL
        fromService:
          type: web
          name: flowguard-api
          envVarKey: RENDER_EXTERNAL_URL
    # REQUIRED: this is a single-page app (React Router). Without the rewrite,
    # deep links and refreshes on /login, /ops, /verify/:txnId and /cases/:id
    # return 404 from the static host.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: flowguard-db
    plan: free
